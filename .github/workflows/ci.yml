name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap audit
        run: python tools/audit.py
      - name: Audit unit tests
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Full-port gate must still fail
        shell: bash
        run: |
          if python tools/audit.py --require-full; then
            echo "require-full unexpectedly passed"
            exit 1
          fi
      - name: Go tests
        run: go test ./...
      - name: Go-compat functional tests
        working-directory: bench/go-compat
        run: go test ./...

  docs:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Docs structure
        run: python tools/docs_check.py
      - name: Docs tool tests
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Executable examples
        run: |
          go test -json -count=1 -run '^Example' ./dx | tee /tmp/example-events.jsonl
          python tools/docs_check.py --events /tmp/example-events.jsonl
      - name: Quickstart build
        run: go build -o /tmp/docquickstart ./examples/docquickstart
      - name: Source consumer
        env:
          GOWORK: "off"
        run: python tools/consumer_check.py --mode source

  consumer:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.2"
      - name: Nested consumer module
        working-directory: consumer
        run: go test .

  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.2"
      - name: CLI module tests
        working-directory: cmd/treestamp
        run: go test ./...
      - name: CLI help smoke
        working-directory: cmd/treestamp
        run: go run . version --json

  parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: reference/rust-driver
      - name: Functional parity including cache/watch
        run: python tools/run_functional_parity.py
