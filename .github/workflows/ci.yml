name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.21.x", "stable"]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap audit
        run: python tools/audit.py
      - name: Audit unit tests
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Full-port gate
        run: python tools/audit.py --require-full
      - name: Go tests
        run: go test ./...
      - name: Go-compat functional tests
        if: matrix.go != '1.21.x'
        working-directory: bench/go-compat
        env:
          GOWORK: "off"
        run: go test ./...
      - name: WalkDirs informal benches
        if: matrix.go != '1.21.x'
        working-directory: bench/go-compat
        env:
          GOWORK: "off"
        shell: bash
        run: go test -bench=BenchmarkWalkDirs -benchmem -count=1 -timeout 10m | tee walkdirs-g05.txt
      - uses: actions/upload-artifact@v4
        if: matrix.go != '1.21.x'
        with:
          name: walkdirs-g05-${{ matrix.os }}-${{ matrix.go }}
          path: bench/go-compat/walkdirs-g05.txt
          if-no-files-found: warn

  go-minors:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go: ["1.21.x", "1.22.x", "1.23.x", "1.24.x", "1.25.x", "1.26.x"]
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Library on this Go
        run: go test ./...
      - name: CLI on this Go
        working-directory: cmd/treestamp
        run: go test ./...
      - name: Watch on this Go
        working-directory: watch
        env:
          GOWORK: "off"
        run: go test ./...

  docs:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Docs structure
        run: python tools/docs_check.py
      - name: Docs tool tests
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Executable examples
        run: |
          go test -json -count=1 -run '^Example' ./dx | tee /tmp/example-events.jsonl
          python tools/docs_check.py --events /tmp/example-events.jsonl
      - name: Quickstart build
        run: go build -o /tmp/docquickstart ./examples/docquickstart
      - name: Source consumer
        env:
          GOWORK: "off"
        run: python tools/consumer_check.py --mode source

  consumer:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
      - name: Nested consumer module
        working-directory: consumer
        run: go test .

  cli:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.21.x", "stable"]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: CLI module tests
        working-directory: cmd/treestamp
        run: go test ./...
      - name: CLI module tests (GOWORK=off)
        working-directory: cmd/treestamp
        env:
          GOWORK: "off"
        run: go test ./...
      - name: CLI help smoke
        working-directory: cmd/treestamp
        run: go run . version --json

  watch:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.21.x", "stable"]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Optional watch module
        working-directory: watch
        run: go test ./...

  parity:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: reference/rust-driver
      - name: Functional parity including cache/watch
        run: python tools/run_functional_parity.py
