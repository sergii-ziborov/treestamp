name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap audit
        run: python tools/audit.py
      - name: Audit unit tests
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Full-port gate must still fail
        shell: bash
        run: |
          if python tools/audit.py --require-full; then
            echo "require-full unexpectedly passed"
            exit 1
          fi
      - name: Go tests
        run: go test ./...
